##### PREFIX #####

# Вместо стандартного Ctrl+B используем Ctrl+Space
unbind C-b

set -g prefix C-a
bind C-a send-prefix

##### GENERAL #####

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim keybindings
setw -g mode-keys vi
set -g status-keys vi

# Быстрый Esc
set -sg escape-time 10

# Цвета
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"

##### STATUS BAR #####

set -g status-position top
set -g status-left-length 40
set -g status-right-length 100

set -g status-style "bg=#232136,fg=#e0def4"

set -g status-left "#[fg=#f6c177,bold]#S "
set -g status-right "#[fg=#9ccfd8]%H:%M #[fg=#c4a7e7]%d-%m-%Y"

##### PANE BORDERS #####

set -g pane-border-lines heavy
set -g pane-border-style "fg=#6e6a86"
set -g pane-active-border-style "fg=#f6c177"

##### SPLITS #####

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### PANE NAVIGATION #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### RESIZE #####

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### WINDOWS #####

bind c new-window -c "#{pane_current_path}"

bind x kill-pane

bind n next-window
bind p previous-window

##### RELOAD #####

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

##### CLOCK #####

set -g clock-mode-style 24

##### FOCUS EVENTS #####

set -g focus-events on

##### CATPPUCCIN #####

set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "directory date_time"

set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_directory_text "#{pane_current_path}"

##### TPM #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'

run '~/.tmux/plugins/tpm/tpm'